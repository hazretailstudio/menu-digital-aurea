<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KDS · Comandas en Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body class="bg-stone-950 text-stone-100 min-h-screen">
  <header class="sticky top-0 z-20 bg-stone-900 border-b border-stone-800 px-4 py-3 flex items-center justify-between">
    <div>
      <h1 id="kdsTitle" class="font-black text-lg text-amber-400">🍳 Tablero KDS en Vivo</h1>
      <p id="kdsStatus" class="text-xs text-emerald-400 font-mono">Conectando...</p>
    </div>
    <div class="flex items-center gap-2">
      <button id="btnEnablePush" class="px-3 py-1.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold">
        🔔 Activar Alertas Push
      </button>
      <button id="btnTestSound" class="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-xs font-bold">
        🔊 Probar Sonido
      </button>
    </div>
  </header>

  <main id="kdsBoard" class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></main>

  <script type="module" src="/js/kds.js"></script>
</body>
</html>
