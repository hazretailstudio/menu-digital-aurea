<!-- MODAL DE CONFIGURACIÓN DE ESTATUS Y SONIDOS INDEPENDIENTES -->
<div id="statusConfigModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-2xl rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center border-b pb-3">
      <h3 class="font-extrabold text-base text-stone-900">⚙️ Configuración de Estatus y Sonidos</h3>
      <button onclick="closeStatusConfigModal()" class="text-stone-400 font-bold text-lg">✕</button>
    </div>
    <div id="statusConfigList" class="space-y-3"></div>
    <div class="pt-3 border-t flex justify-between items-center">
      <button onclick="addNewCustomStatus()" class="bg-stone-100 text-stone-800 text-xs font-bold px-4 py-2 rounded-xl border">+ Añadir Estatus</button>
      <button onclick="saveStatusConfiguration()" class="bg-amber-600 text-white font-bold text-xs px-6 py-2 rounded-xl shadow-md">Guardar Cambios ✓</button>
    </div>
  </div>
</div>

<!-- MODAL NUEVO PEDIDO MANUAL CON CANDADO DE MESAS Y BUSCADOR -->
<div id="newOrderManualModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto no-scrollbar">
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="font-extrabold text-base text-stone-900">🛎️ Tomar Pedido Manual</h3>
      <button onclick="closeNewOrderModal()" class="text-stone-400 font-bold text-lg">✕</button>
    </div>

    <div class="grid grid-cols-3 gap-2 text-xs">
      <div>
        <label class="block font-bold text-stone-700 mb-1">Canal:</label>
        <select id="manualOrderChannel" class="w-full border rounded-xl p-2 bg-stone-50 font-bold">
          <option value="dine_in">Mesa</option>
          <option value="takeout">Para Llevar</option>
          <option value="rappi">Rappi</option>
          <option value="didi">DiDi Food</option>
          <option value="ubereats">Uber Eats</option>
        </select>
      </div>
      <div>
        <label class="block font-bold text-stone-700 mb-1">Mesa / Etiqueta:</label>
        <input type="text" id="manualOrderTable" placeholder="01" class="w-full border rounded-xl p-2 font-bold text-center">
      </div>
      <div>
        <label class="block font-bold text-stone-700 mb-1">Mesero:</label>
        <select id="manualOrderWaiter" class="w-full border rounded-xl p-2 bg-stone-50 font-bold"></select>
      </div>
    </div>

    <div class="border rounded-2xl p-3 bg-stone-50 space-y-2 text-xs">
      <label class="block font-bold text-stone-800">Buscar Platillo:</label>
      <input type="text" id="manualProdSearchInput" oninput="filterManualProductDropdown(this.value)" placeholder="Escribe el nombre del platillo..." class="w-full border rounded-xl p-2 bg-white">
      <div id="manualProdDropdown" class="hidden border rounded-xl bg-white max-h-48 overflow-y-auto divide-y shadow-md"></div>
    </div>

    <div class="space-y-1.5 text-xs">
      <label class="block font-bold uppercase text-stone-500 text-[10px]">Platillos en Comanda:</label>
      <div id="manualOrderItemsList" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
    </div>

    <div>
      <label class="block font-bold text-stone-700 text-xs mb-1">Notas de Cocina:</label>
      <textarea id="manualOrderNotes" rows="2" class="w-full border rounded-xl p-2 text-xs bg-stone-50" placeholder="Ej: Sin cebolla, término 3/4..."></textarea>
    </div>

    <div class="pt-3 border-t flex justify-between items-center">
      <span class="text-xl font-black font-mono text-stone-900" id="manualOrderTotalDisplay">$0.00 MXN</span>
      <button onclick="submitManualOrder()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs px-6 py-2.5 rounded-xl shadow-md">
        Crear Comanda 🛎️
      </button>
    </div>
  </div>
</div>

<!-- MODAL RETROCESO EN PREPARACIÓN CON SELECCIÓN ACTIVA -->
<div id="retrocesoModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4">
    <div class="flex items-center gap-2 border-b pb-3">
      <span class="text-xl">⚠️</span>
      <div>
        <h3 class="font-bold text-base text-stone-900">Control de Insumos y Destino</h3>
        <p class="text-[11px] text-stone-500" id="retrocesoModalSub">Mesa --</p>
      </div>
    </div>

    <div id="retrocesoStep1" class="space-y-3">
      <label class="block text-xs font-bold text-stone-800">1. ¿El platillo ya se había preparado / cocinado?</label>
      <div class="grid grid-cols-2 gap-2 text-xs font-bold">
        <button id="btnRetroNoPrep" onclick="handleRetrocesoInventoryChoice('no_prepared')" class="p-3 border rounded-xl text-left transition space-y-1 bg-white">
          <span class="block text-emerald-700 font-bold">❌ Aún no se preparó</span>
          <span class="text-[10px] font-normal text-stone-500 block">Reincorporar 100% de insumos.</span>
        </button>
        <button id="btnRetroPrep" onclick="handleRetrocesoInventoryChoice('prepared')" class="p-3 border rounded-xl text-left transition space-y-1 bg-white">
          <span class="block text-amber-800 font-bold">🍳 Sí, ya está listo</span>
          <span class="text-[10px] font-normal text-stone-500 block">Decidir si se revende o es merma.</span>
        </button>
      </div>
    </div>

    <div id="retrocesoStep1Sub" class="hidden space-y-2 border-t pt-3">
      <label class="block text-xs font-bold text-stone-800">Destino del platillo preparado:</label>
      <div class="grid grid-cols-2 gap-2 text-xs font-bold">
        <button id="btnRetroBuffer" onclick="setRetrocesoPreparedDestination('buffer_resell')" class="p-3 border rounded-xl text-left transition bg-white">
          <span class="block text-blue-700 font-bold">🥪 Es Revendible</span>
          <span class="text-[10px] font-normal text-stone-500 block">Enviar a buffer para próximo cliente.</span>
        </button>
        <button id="btnRetroWaste" onclick="setRetrocesoPreparedDestination('waste_loss')" class="p-3 border rounded-xl text-left transition bg-white">
          <span class="block text-rose-700 font-bold">🗑️ Es Merma</span>
          <span class="text-[10px] font-normal text-stone-500 block">Registrar costo de pérdida.</span>
        </button>
      </div>
    </div>

    <div id="retrocesoStep2" class="hidden space-y-3 border-t pt-3">
      <label class="block text-xs font-bold text-stone-800">2. ¿Qué deseas hacer con la comanda?</label>
      <div class="grid grid-cols-2 gap-2 text-xs font-bold">
        <button onclick="finalizeRetrocesoOrderAction('return_flow')" class="p-3 border rounded-xl hover:bg-stone-100 text-left">
          <span class="block text-stone-900 font-bold">🔄 Regresar a Recibida</span>
          <span class="text-[10px] font-normal text-stone-500 block">La comanda continúa viva en cocina.</span>
        </button>
        <button onclick="finalizeRetrocesoOrderAction('delete_order')" class="p-3 border border-rose-200 hover:bg-rose-50 text-left">
          <span class="block text-rose-700 font-bold">🚫 Eliminar Comanda</span>
          <span class="text-[10px] font-normal text-stone-500 block">Archivar como Cancelada en historial.</span>
        </button>
      </div>
    </div>

    <div class="flex justify-end pt-2 border-t">
      <button onclick="closeRetrocesoModal()" class="text-xs font-bold text-stone-500 hover:text-stone-800 px-4 py-2">
        Cancelar
      </button>
    </div>
  </div>
</div>
