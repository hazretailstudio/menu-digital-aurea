  <script>
    const REST_ID = 'b47a9880-9fd3-4c9b-b05b-86ea8f0d014d';
    const SUPABASE_URL = 'https://jmqqkgshwwycercknzgy.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImptcXFrZ3Nod3d5Y2VyY2tuemd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNzYyODUsImV4cCI6MjEwODk1MjI4NX0.tCiRMvl05IXv_IGXIeJ2h9p6AEABRgPofgIRQZMt9UE';

    let client = null;
    try {
      if (window.supabase) client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    } catch(e) {}

    const WAITERS_LIST = ['Carlos M.', 'Sofía R.', 'Miguel A.', 'Barra / Mostrador'];
    let customStatusConfig = JSON.parse(localStorage.getItem('kds_status_config') || 'null') || [
      { id: 'pending', name: '1. Recibida en Cocina', color: '#f59e0b', sound_in: 'bell', sound_out: 'arcade' },
      { id: 'preparing', name: '2. En Preparación', color: '#ea580c', sound_in: 'arcade', sound_out: 'dingdong' },
      { id: 'delivered', name: '3. Servida en Mesa', color: '#2563eb', sound_in: 'dingdong', sound_out: 'reward' },
      { id: 'paid', name: '4. Cobrada / Finalizada', color: '#16a34a', sound_in: 'reward', sound_out: 'fanfare' }
    ];

    let adminOrders = [];
    let adminProducts = [];
    let adminSupplies = [];
    let adminRecipes = [];
    let adminBuffer = [];
    let adminWaste = [];
    let manualOrderItems = [];

    let retrocesoOrderId = null;
    let retrocesoInventoryChoice = null;
    let retrocesoPreparedDest = null;

    // AUDIO API
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playTone(freq, startTime, duration, type = 'sine', gainLevel = 0.25) {
      try {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(gainLevel, startTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(startTime); osc.stop(startTime + duration);
      } catch(e) {}
    }

    const SOUND_ENGINES = {
      bell: (ctx, t) => { playTone(1046.5, t, 0.35, 'triangle', 0.3); playTone(1567.9, t + 0.12, 0.5, 'sine', 0.35); },
      chime: (ctx, t) => { playTone(523.25, t, 0.2, 'sine', 0.25); playTone(659.25, t + 0.08, 0.2, 'sine', 0.28); playTone(783.99, t + 0.16, 0.4, 'triangle', 0.32); },
      dingdong: (ctx, t) => { playTone(1318.5, t, 0.3, 'triangle', 0.3); playTone(987.7, t + 0.15, 0.5, 'sine', 0.3); },
      arcade: (ctx, t) => { playTone(440, t, 0.15, 'triangle', 0.25); playTone(880, t + 0.08, 0.25, 'triangle', 0.25); },
      fanfare: (ctx, t) => { playTone(783.99, t, 0.1, 'square', 0.18); playTone(1046.5, t + 0.15, 0.35, 'square', 0.25); },
      reward: (ctx, t) => { playTone(523, t, 0.1, 'triangle', 0.2); playTone(659, t + 0.08, 0.1, 'triangle', 0.2); playTone(1046, t + 0.16, 0.4, 'sine', 0.3); }
    };

    function playSoundByName(presetName) {
      if (!presetName || presetName === 'none') return;
      try {
        const ctx = getAudioContext();
        const engine = SOUND_ENGINES[presetName] || SOUND_ENGINES.bell;
        engine(ctx, ctx.currentTime);
      } catch(e) {}
    }

    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('appSidebar');
      const content = document.getElementById('mainContentArea');
      const backdrop = document.getElementById('sidebarBackdrop');
      const isClosed = (forceState !== undefined) ? !forceState : sidebar.classList.contains('sidebar-hidden');

      if (!isClosed) {
        sidebar.classList.add('sidebar-hidden');
        content.classList.add('sidebar-collapsed');
        backdrop.classList.add('hidden');
      } else {
        sidebar.classList.remove('sidebar-hidden');
        content.classList.remove('sidebar-collapsed');
        if (window.innerWidth < 768) backdrop.classList.remove('hidden');
      }
    }

    function toggleFocusMode() {
      document.body.classList.toggle('focus-mode');
    }

    function switchStationRole(role) {
      const gLive = document.getElementById('navGroup-live');
      const gMgmt = document.getElementById('navGroup-management');
      const gAnal = document.getElementById('navGroup-analytics');
      if (role === 'kitchen') {
        gLive.classList.remove('hidden'); gMgmt.classList.add('hidden'); gAnal.classList.add('hidden');
        switchTab('orders');
      } else if (role === 'waiter') {
        gLive.classList.remove('hidden'); gMgmt.classList.add('hidden'); gAnal.classList.add('hidden');
        switchTab('calls');
      } else {
        gLive.classList.remove('hidden'); gMgmt.classList.remove('hidden'); gAnal.classList.remove('hidden');
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-panel').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('bg-amber-600', 'text-white', 'shadow-sm', 'font-bold');
        btn.classList.add('text-stone-400', 'font-medium');
      });
      const targetPanel = document.getElementById(`tab-${tabId}`);
      const targetBtn = document.getElementById(`tabBtn-${tabId}`);
      if (targetPanel && targetBtn) {
        targetPanel.classList.remove('hidden');
        targetBtn.classList.remove('text-stone-400', 'font-medium');
        targetBtn.classList.add('bg-amber-600', 'text-white', 'shadow-sm', 'font-bold');
      }
    }

    // RENDERIZADO DEL KANBAN CON DUAL TIMER E INDICADORES VISUALES
    function renderKanbanBoard() {
      const container = document.getElementById('kanbanBoardContainer');
      if (!container) return;

      container.innerHTML = customStatusConfig.map((col, idx) => {
        const ordersInStatus = adminOrders.filter(o => !o.is_archived && o.status === col.id);
        const count = ordersInStatus.length;

        return `
          <div id="column-${col.id}" class="bg-stone-200/70 rounded-3xl p-3.5 space-y-3 border border-stone-300">
            <!-- HEADER DE COLUMNA GRANDE -->
            <div class="flex justify-between items-center p-2 rounded-2xl bg-white shadow-xs border">
              <div class="flex items-center gap-2">
                <span class="w-3.5 h-3.5 rounded-full" style="background-color: ${col.color}"></span>
                <h3 class="font-black text-xs uppercase text-stone-800">${col.name}</h3>
              </div>
              <div class="bg-stone-900 text-white px-3 py-1 rounded-xl text-sm font-black font-mono">
                ${count}
              </div>
            </div>

            <div class="space-y-3 min-h-[250px]">
              ${ordersInStatus.map(order => renderOrderCardHtml(order, idx)).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderOrderCardHtml(order, currentIdx) {
      const items = Array.isArray(order.items) ? order.items : [];

      // CRONÓMETRO DUAL
      const createdMs = new Date(order.kitchen_cycle_started_at || order.created_at).getTime();
      const deliveredMs = order.delivered_at ? new Date(order.delivered_at).getTime() : null;
      const paidMs = order.paid_at ? new Date(order.paid_at).getTime() : null;

      let t1Secs = deliveredMs ? Math.max(0, Math.floor((deliveredMs - createdMs) / 1000)) : Math.max(0, Math.floor((Date.now() - createdMs) / 1000));
      let t1Label = deliveredMs ? `✓ Servido en: ${formatElapsed(t1Secs)}` : `🔥 Cocina: ${formatElapsed(t1Secs)}`;
      let t1Class = deliveredMs ? 'bg-blue-50 text-blue-900 border-blue-200' : (t1Secs > 900 ? 'bg-rose-100 text-rose-900 pulse-danger' : 'bg-stone-100 text-stone-800');

      let t2Label = '--:--', t2Class = 'bg-stone-50 text-stone-400';
      if (deliveredMs) {
        let t2Secs = paidMs ? Math.max(0, Math.floor((paidMs - deliveredMs) / 1000)) : Math.max(0, Math.floor((Date.now() - deliveredMs) / 1000));
        t2Label = paidMs ? `✓ Pagó en: ${formatElapsed(t2Secs)}` : `🍽️ En Mesa: ${formatElapsed(t2Secs)}`;
        t2Class = paidMs ? 'bg-emerald-50 text-emerald-900 border-emerald-200' : 'bg-amber-50 text-amber-900 border-amber-200';
      }

      const totalEstancia = Math.max(0, Math.floor(((paidMs || Date.now()) - new Date(order.created_at).getTime()) / 1000));

      const hasNext = currentIdx < customStatusConfig.length - 1;
      const nextCol = hasNext ? customStatusConfig[currentIdx + 1] : null;

      return `
        <div class="bg-white rounded-2xl border-2 border-stone-200 p-3.5 shadow-sm space-y-2.5">
          <div class="flex justify-between items-start">
            <div>
              <span class="bg-amber-100 text-amber-900 text-[10px] font-black px-2 py-0.5 rounded-lg">Mesa ${order.table_number}</span>
              <span class="text-[10px] text-stone-400 font-mono ml-1">#${(order.id||'').substring(0,4)}</span>
            </div>
            <span class="text-xs font-bold text-stone-600">${order.waiter_name || 'Sin asignar'}</span>
          </div>

          <!-- CRONÓMETRO DUAL -->
          <div class="bg-stone-50 border rounded-xl p-2 space-y-1">
            <div class="grid grid-cols-2 gap-1 text-[10px] font-mono font-bold text-center">
              <div class="border rounded-lg p-1 ${t1Class}">${t1Label}</div>
              <div class="border rounded-lg p-1 ${t2Class}">${t2Label}</div>
            </div>
            <div class="text-[9px] text-stone-500 text-center font-mono">
              Estancia Total: <b class="text-stone-800">${formatElapsed(totalEstancia)}</b>
            </div>
          </div>

          <!-- PRODUCTOS RESALTANDO LO NUEVO -->
          <div class="space-y-1 text-xs border-t pt-2">
            ${items.map(it => `
              <div class="flex justify-between items-start ${it.is_new ? 'bg-amber-100 border border-amber-300 rounded p-1 font-bold' : ''}">
                <span>${it.qty}x ${it.title} ${it.is_new ? '<span class="text-[9px] bg-amber-600 text-white px-1 rounded ml-1">NUEVO</span>' : ''}</span>
                <span class="font-mono text-stone-500">$${(it.price * it.qty).toFixed(2)}</span>
              </div>
            `).join('')}
            ${order.customer_notes ? `<div class="p-1 rounded text-[10px] ${order.notes_updated ? 'bg-amber-200 text-amber-950 font-bold border border-amber-300' : 'bg-stone-100 text-stone-600'}">Nota: ${order.customer_notes}</div>` : ''}
          </div>

          <div class="flex justify-between items-center text-xs border-t pt-2">
            <span class="font-black text-sm font-mono text-stone-900">$${Number(order.total).toFixed(2)}</span>
            ${order.split_type && order.split_type !== 'single' ? '<span class="text-[10px] font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded">👥 Cuenta Dividida</span>' : ''}
          </div>

          <div class="flex items-center gap-1.5 pt-1">
            ${currentIdx > 0 ? `
              <button onclick="requestRetrocesoOrder('${order.id}')" class="px-2.5 py-1.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-xs font-bold">←</button>
            ` : ''}
            ${hasNext ? `
              <button onclick="advanceOrderStatus('${order.id}')" class="flex-grow py-1.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold">
                Mover a ${nextCol.name} →
              </button>
            ` : `
              <button onclick="archiveOrder('${order.id}')" class="flex-grow py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">
                Cobrada ✓
              </button>
            `}
          </div>
        </div>
      `;
    }

    async function advanceOrderStatus(orderId) {
      const order = adminOrders.find(o => o.id === orderId);
      if (!order) return;
      const currentIdx = customStatusConfig.findIndex(c => c.id === order.status);
      const nextCol = customStatusConfig[currentIdx + 1];
      if (!nextCol) return;

      const nowIso = new Date().toISOString();
      const prevCol = customStatusConfig[currentIdx];

      if (prevCol?.sound_out) playSoundByName(prevCol.sound_out);
      if (nextCol?.sound_in) playSoundByName(nextCol.sound_in);

      order.status = nextCol.id;
      if (nextCol.id === 'preparing') order.preparing_at = nowIso;
      if (nextCol.id === 'delivered') order.delivered_at = nowIso;
      if (nextCol.id === 'paid') order.paid_at = nowIso;

      renderKanbanBoard();
      if (client) {
        await client.from('orders').update({
          status: nextCol.id,
          preparing_at: order.preparing_at,
          delivered_at: order.delivered_at,
          paid_at: order.paid_at
        }).eq('id', orderId);
      }
    }

    // RETROCESO EN 2 PASOS CON VISUALIZACIÓN ACTIVA
    function requestRetrocesoOrder(orderId) {
      const order = adminOrders.find(o => o.id === orderId);
      if (!order) return;

      retrocesoOrderId = orderId;
      retrocesoInventoryChoice = null;
      retrocesoPreparedDest = null;

      // Reset visual de botones
      ['btnRetroNoPrep', 'btnRetroPrep', 'btnRetroBuffer', 'btnRetroWaste'].forEach(b => {
        const el = document.getElementById(b);
        if (el) el.className = 'p-3 border rounded-xl text-left transition space-y-1 bg-white';
      });

      if (order.status === 'preparing') {
        document.getElementById('retrocesoModalSub').innerText = `Mesa ${order.table_number}`;
        document.getElementById('retrocesoStep1').classList.remove('hidden');
        document.getElementById('retrocesoStep1Sub').classList.add('hidden');
        document.getElementById('retrocesoStep2').classList.add('hidden');
        document.getElementById('retrocesoModal').classList.remove('hidden');
      } else if (order.status === 'delivered') {
        const rePrep = confirm("¿Se preparará en cocina algún producto nuevo o modificación?\n\n• [Aceptar]: Regresar a 'En Preparación' e iniciar nuevo contador de cocina.\n• [Cancelar]: Regresar normalmente.");
        if (rePrep) {
          order.status = 'preparing';
          order.kitchen_cycle_started_at = new Date().toISOString();
        } else {
          order.status = 'preparing';
        }
        renderKanbanBoard();
        if (client) client.from('orders').update({ status: order.status, kitchen_cycle_started_at: order.kitchen_cycle_started_at }).eq('id', order.id);
      } else {
        const currentIdx = customStatusConfig.findIndex(c => c.id === order.status);
        order.status = customStatusConfig[currentIdx - 1].id;
        renderKanbanBoard();
        if (client) client.from('orders').update({ status: order.status }).eq('id', order.id);
      }
    }

    function handleRetrocesoInventoryChoice(choice) {
      retrocesoInventoryChoice = choice;
      document.getElementById('btnRetroNoPrep').className = choice === 'no_prepared' ? 'p-3 border-2 border-emerald-600 bg-emerald-50 rounded-xl text-left' : 'p-3 border rounded-xl text-left bg-white opacity-50';
      document.getElementById('btnRetroPrep').className = choice === 'prepared' ? 'p-3 border-2 border-amber-600 bg-amber-50 rounded-xl text-left' : 'p-3 border rounded-xl text-left bg-white opacity-50';

      if (choice === 'no_prepared') {
        document.getElementById('retrocesoStep1Sub').classList.add('hidden');
        document.getElementById('retrocesoStep2').classList.remove('hidden');
      } else {
        document.getElementById('retrocesoStep1Sub').classList.remove('hidden');
      }
    }

    function setRetrocesoPreparedDestination(dest) {
      retrocesoPreparedDest = dest;
      document.getElementById('btnRetroBuffer').className = dest === 'buffer_resell' ? 'p-3 border-2 border-blue-600 bg-blue-50 rounded-xl text-left' : 'p-3 border rounded-xl text-left bg-white opacity-50';
      document.getElementById('btnRetroWaste').className = dest === 'waste_loss' ? 'p-3 border-2 border-rose-600 bg-rose-50 rounded-xl text-left' : 'p-3 border rounded-xl text-left bg-white opacity-50';
      document.getElementById('retrocesoStep2').classList.remove('hidden');
    }

    async function finalizeRetrocesoOrderAction(action) {
      const order = adminOrders.find(o => o.id === retrocesoOrderId);
      if (!order) return;

      if (action === 'return_flow') {
        order.status = 'pending';
        order.preparing_at = null;
      } else {
        order.status = 'cancelled';
        order.is_archived = true;
      }

      renderKanbanBoard();
      closeRetrocesoModal();
      if (client) await client.from('orders').update({ status: order.status, is_archived: order.is_archived }).eq('id', order.id);
    }

    function closeRetrocesoModal() {
      document.getElementById('retrocesoModal').classList.add('hidden');
    }

    // CANDADO DE ASIGNACIÓN DE MESAS
    async function submitManualOrder() {
      if (manualOrderItems.length === 0) { alert("Agrega al menos un platillo."); return; }
      const tableNum = document.getElementById('manualOrderTable').value.trim() || '01';
      const channel = document.getElementById('manualOrderChannel').value;

      if (channel === 'dine_in') {
        const activeExisting = adminOrders.find(o => o.table_number === tableNum && o.status !== 'paid' && o.status !== 'cancelled' && !o.is_archived);
        if (activeExisting) {
          const unite = confirm(`La Mesa ${tableNum} ya tiene una comanda activa (#${activeExisting.id.substring(0,4)}).\n\n• [Aceptar]: Unificar y enviar lo nuevo a cocina.\n• [Cancelar]: Crear cuenta separada (${tableNum}-B).`);
          if (unite) {
            manualOrderItems.forEach(it => activeExisting.items.unshift({ ...it, is_new: true }));
            activeExisting.has_new_additions = true;
            activeExisting.status = 'preparing';
            activeExisting.kitchen_cycle_started_at = new Date().toISOString();
            activeExisting.total = activeExisting.items.reduce((acc, i) => acc + (i.price * i.qty), 0);

            if (client) {
              await client.from('orders').update({
                items: activeExisting.items,
                has_new_additions: true,
                status: 'preparing',
                kitchen_cycle_started_at: activeExisting.kitchen_cycle_started_at,
                total: activeExisting.total
              }).eq('id', activeExisting.id);
            }
            renderKanbanBoard();
            closeNewOrderModal();
            return;
          } else {
            document.getElementById('manualOrderTable').value = `${tableNum}-B`;
          }
        }
      }

      const total = manualOrderItems.reduce((acc, it) => acc + (it.price * it.qty), 0);
      const newOrder = {
        id: 'ord-' + Date.now(),
        restaurant_id: REST_ID,
        table_number: tableNum,
        order_channel: channel,
        waiter_name: document.getElementById('manualOrderWaiter').value,
        items: manualOrderItems,
        subtotal: total,
        total: total,
        status: customStatusConfig[0].id,
        is_archived: false,
        created_at: new Date().toISOString()
      };

      adminOrders.unshift(newOrder);
      renderKanbanBoard();
      closeNewOrderModal();
      if (client) await client.from('orders').insert([newOrder]);
    }

    function openNewOrderModal() {
      manualOrderItems = [];
      const waiterSelect = document.getElementById('manualOrderWaiter');
      waiterSelect.innerHTML = WAITERS_LIST.map(w => `<option value="${w}">${w}</option>`).join('');
      renderManualOrderItems();
      document.getElementById('newOrderManualModal').classList.remove('hidden');
    }
    function closeNewOrderModal() { document.getElementById('newOrderManualModal').classList.add('hidden'); }

    function filterManualProductDropdown(query) {
      const q = query.toLowerCase().trim();
      const drop = document.getElementById('manualProdDropdown');
      if (!q) { drop.classList.add('hidden'); return; }

      const matches = adminProducts.filter(p => p.title.toLowerCase().includes(q));
      drop.classList.remove('hidden');
      drop.innerHTML = matches.map(p => `
        <div onclick="selectProductToAddManual('${p.id}')" class="p-2 hover:bg-amber-50 cursor-pointer flex justify-between text-xs">
          <span>${p.title}</span>
          <span class="font-bold font-mono">$${Number(p.price).toFixed(2)}</span>
        </div>
      `).join('');
    }

    function selectProductToAddManual(prodId) {
      const prod = adminProducts.find(p => p.id === prodId);
      if (!prod) return;
      manualOrderItems.push({ id: prod.id, title: prod.title, price: Number(prod.price), qty: 1 });
      document.getElementById('manualProdDropdown').classList.add('hidden');
      document.getElementById('manualProdSearchInput').value = '';
      renderManualOrderItems();
    }

    function renderManualOrderItems() {
      const cont = document.getElementById('manualOrderItemsList');
      cont.innerHTML = manualOrderItems.map((it, idx) => `
        <div class="flex justify-between items-center p-2 rounded-xl bg-stone-100 text-xs">
          <span>${it.title}</span>
          <div class="flex items-center gap-2">
            <span class="font-bold">$${(it.price * it.qty).toFixed(2)}</span>
            <button onclick="manualOrderItems.splice(${idx},1); renderManualOrderItems();" class="text-rose-600 font-bold">✕</button>
          </div>
        </div>
      `).join('');
      const total = manualOrderItems.reduce((acc, it) => acc + (it.price * it.qty), 0);
      document.getElementById('manualOrderTotalDisplay').innerText = `$${total.toFixed(2)} MXN`;
    }

    function openStatusConfigModal() {
      const cont = document.getElementById('statusConfigList');
      cont.innerHTML = customStatusConfig.map((st, idx) => `
        <div class="border rounded-2xl p-3 bg-stone-50 text-xs flex justify-between items-center">
          <input type="text" value="${st.name}" onchange="customStatusConfig[${idx}].name=this.value" class="border rounded px-2 py-1 font-bold">
          <button onclick="playSoundByName('${st.sound_in}')" class="text-stone-500 font-bold">▶ Sonido In</button>
        </div>
      `).join('');
      document.getElementById('statusConfigModal').classList.remove('hidden');
    }
    function closeStatusConfigModal() { document.getElementById('statusConfigModal').classList.add('hidden'); }
    function saveStatusConfiguration() {
      localStorage.setItem('kds_status_config', JSON.stringify(customStatusConfig));
      closeStatusConfigModal();
      renderKanbanBoard();
    }

    function formatElapsed(secs) {
      const m = Math.floor(Math.max(0, secs) / 60);
      const s = Math.max(0, secs) % 60;
      return `${m}m ${s < 10 ? '0' : ''}${s}s`;
    }

    async function init() {
      adminOrders = [
        {
          id: 'ord-demo-1',
          table_number: '01',
          waiter_name: 'Carlos M.',
          items: [{ title: 'Tostón de Aguacate Trufado', qty: 2, price: 165.00 }, { title: 'Flat White Pluma', qty: 2, price: 78.00 }],
          total: 486.00,
          status: 'pending',
          created_at: new Date(Date.now() - 300000).toISOString()
        }
      ];
      adminProducts = [
        { id: 'p1', title: 'Tostón de Aguacate Trufado', price: 165.00 },
        { id: 'p2', title: 'Flat White Pluma', price: 78.00 }
      ];

      renderKanbanBoard();
      document.getElementById('connStatus').innerText = 'Sincronizado en tiempo real ✓';

      if (client) {
        const { data } = await client.from('orders').select('*').order('created_at', { ascending: false });
        if (data && data.length > 0) adminOrders = data;
        const prods = await client.from('products').select('*');
        if (prods?.data) adminProducts = prods.data;
        renderKanbanBoard();
      }

      setInterval(renderKanbanBoard, 1000);
    }

    window.onload = init;
  </script>
</body>
